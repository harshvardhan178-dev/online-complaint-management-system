# render.yaml – Render Blueprint deployment configuration
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: smartcomplaint
    runtime: python
    region: singapore
    plan: free
    buildCommand: "pip install -r requirements.txt && flask db upgrade && flask seed-data"
    startCommand: "gunicorn wsgi:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartcomplaint-db
          property: connectionString
      - key: INTERNAL_DATABASE_URL
        fromDatabase:
          name: smartcomplaint-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: run.py
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@smartcomplaint.com
      - key: DEFAULT_ADMIN_PASSWORD
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

databases:
  - name: smartcomplaint-db
    databaseName: smartcomplaint
    user: smartcomplaint
    region: singapore
    plan: free

