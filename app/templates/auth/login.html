<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SmartComplaint System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div style="text-align: center; margin-bottom: 20px;">
                <div class="brand-icon" style="margin: 0 auto 12px; width: 48px; height: 48px; font-size: 20px;">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <h2 class="auth-title">Welcome Back</h2>
                <p class="auth-subtitle">Sign in to SmartComplaint Portal</p>
            </div>

            <!-- Flash alerts -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            <span>{{ message }}</span>
                            <button type="button" class="alert-close" onclick="this.parentElement.remove()">&times;</button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Quick Demo Credentials Box -->
            <div class="demo-credentials">
                <div style="font-weight: 600; margin-bottom: 6px; color: #475569;">
                    <i class="fa-solid fa-key"></i> Quick Demo Login:
                </div>
                <div>
                    <span class="demo-pill" data-email="admin@smartcomplaint.com" data-password="Admin@123">
                        <i class="fa-solid fa-crown text-warning"></i> Admin
                    </span>
                    <span class="demo-pill" data-email="staff@smartcomplaint.com" data-password="Staff@123">
                        <i class="fa-solid fa-user-shield text-info"></i> Staff
                    </span>
                    <span class="demo-pill" data-email="user@smartcomplaint.com" data-password="User@123">
                        <i class="fa-solid fa-user text-primary"></i> User
                    </span>
                </div>
            </div>

            <form action="{{ url_for('auth.login') }}" method="POST">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
                </div>

                <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 0.88rem; cursor: pointer;">
                        <input type="checkbox" name="remember" value="1"> Remember me
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; margin-top: 10px;">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: #64748b;">
                Don't have an account? <a href="{{ url_for('auth.register') }}" style="font-weight: 600;">Create Account</a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
