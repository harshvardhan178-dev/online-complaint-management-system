<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — SmartComplaint System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 500px;">
            <div style="text-align: center; margin-bottom: 20px;">
                <div class="brand-icon" style="margin: 0 auto 12px; width: 48px; height: 48px; font-size: 20px;">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2 class="auth-title">Create Account</h2>
                <p class="auth-subtitle">Register to submit and track your complaints</p>
            </div>

            <!-- Flash alerts -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            <span>{{ message }}</span>
                            <button type="button" class="alert-close" onclick="this.parentElement.remove()">&times;</button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('auth.register') }}" method="POST">
                <div class="form-group">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" id="full_name" name="full_name" class="form-control" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="john@example.com">
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Phone Number (Optional)</label>
                    <input type="tel" id="phone" name="phone" class="form-control" placeholder="+1 234 567 8900">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                    <div class="form-group">
                        <label for="role" class="form-label">Account Role</label>
                        <select id="role" name="role" class="form-select" onchange="toggleDeptSelect(this.value)">
                            <option value="user" selected>General User</option>
                            <option value="staff">Department Staff</option>
                        </select>
                    </div>

                    <div class="form-group" id="dept-group" style="display: none;">
                        <label for="department_id" class="form-label">Department</label>
                        <select id="department_id" name="department_id" class="form-select">
                            <option value="">Select Department</option>
                            {% for dept in departments %}
                                <option value="{{ dept.id }}">{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control" required placeholder="Min. 6 chars">
                    </div>

                    <div class="form-group">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required placeholder="Repeat password">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; margin-top: 10px;">
                    <i class="fa-solid fa-user-check"></i> Register Account
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: #64748b;">
                Already have an account? <a href="{{ url_for('auth.login') }}" style="font-weight: 600;">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        function toggleDeptSelect(role) {
            const deptGroup = document.getElementById('dept-group');
            if (role === 'staff') {
                deptGroup.style.display = 'block';
            } else {
                deptGroup.style.display = 'none';
            }
        }
    </script>
</body>
</html>
