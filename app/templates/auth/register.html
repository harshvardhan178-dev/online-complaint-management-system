<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — SmartComplaint Enterprise SaaS</title>
    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card" style="max-width: 520px;">
            <!-- Brand Emblem Header -->
            <div style="text-align: center; margin-bottom: 24px;">
                <div class="brand-icon" style="margin: 0 auto 14px; width: 52px; height: 52px; font-size: 22px; border-radius: 14px;">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h2 class="auth-title">Create Account</h2>
                <p class="auth-subtitle">Get started with SmartComplaint ticketing system</p>
            </div>

            <!-- Flash alerts -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            <span>{{ message }}</span>
                            <button type="button" class="alert-close" onclick="this.parentElement.remove()">&times;</button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('auth.register') }}" method="POST">
                <div class="form-group">
                    <label for="full_name" class="form-label">Full Name</label>
                    <div style="position: relative;">
                        <input type="text" id="full_name" name="full_name" class="form-control" required placeholder="e.g. John Doe" style="padding-left: 38px;">
                        <i class="fa-regular fa-user" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.95rem;"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <div style="position: relative;">
                        <input type="email" id="email" name="email" class="form-control" required placeholder="name@organization.com" style="padding-left: 38px;">
                        <i class="fa-regular fa-envelope" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.95rem;"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="phone" class="form-label">Phone Number (Optional)</label>
                    <div style="position: relative;">
                        <input type="tel" id="phone" name="phone" class="form-control" placeholder="+1 234 567 8900" style="padding-left: 38px;">
                        <i class="fa-solid fa-phone" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.95rem;"></i>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                    <div class="form-group">
                        <label for="role" class="form-label">Account Role</label>
                        <select id="role" name="role" class="form-select" onchange="toggleDeptSelect(this.value)">
                            <option value="user" selected>General User</option>
                            <option value="staff">Department Staff</option>
                        </select>
                    </div>

                    <div class="form-group" id="dept-group" style="display: none;">
                        <label for="department_id" class="form-label">Department</label>
                        <select id="department_id" name="department_id" class="form-select">
                            <option value="">Select Unit</option>
                            {% for dept in departments %}
                                <option value="{{ dept.id }}">{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control" required placeholder="Min. 6 chars">
                    </div>

                    <div class="form-group">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required placeholder="Repeat password">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: 10px;">
                    <i class="fa-solid fa-check"></i> Complete Registration
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-secondary);">
                Already registered? <a href="{{ url_for('auth.login') }}" style="font-weight: 700; color: var(--primary);">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        function toggleDeptSelect(role) {
            const deptGroup = document.getElementById('dept-group');
            if (role === 'staff') {
                deptGroup.style.display = 'block';
            } else {
                deptGroup.style.display = 'none';
            }
        }
    </script>
</body>
</html>
